<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      const path = window.location.pathname.toLowerCase();
      const search = window.location.search;
      if (path.includes('/status')) {
        window.location.replace('/status.html' + search);
      } else if (path.includes('/duels')) {
        const hasQuery = search && search.length > 1;
        const target = '/index.html?tab=duels' + (hasQuery ? '&' + search.substring(1) : '');
        window.location.replace(target);
      } else {
        window.location.replace('/' + search);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/">MTCTiers</a>...</p>
</body>
</html>
