<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      const path = window.location.pathname.toLowerCase();
      const params = new URLSearchParams(window.location.search);
      if (path.includes('/status')) {
        const qs = params.toString();
        window.location.replace('/status.html' + (qs ? '?' + qs : ''));
        return;
      }
      if (path.includes('/duel')) {
        const parts = path.split('/').filter(Boolean);
        const maybeId = parts.length >= 2 ? parts[parts.length - 1] : '';
        if (/^[1-9]\d{0,8}$/.test(maybeId) && !params.has('duel')) {
          params.set('duel', maybeId);
        }
        params.set('tab', 'duels');
        window.location.replace('/index.html?' + params.toString());
        return;
      }
      const qs = window.location.search || '';
      window.location.replace('/' + qs);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/">MTCTiers</a>...</p>
</body>
</html>
