      right: 20px;

      border: 1px solid var(--crimson);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      display: none;
      z-index: 1000;
    }

    .logout-btn:hover {
      background: var(--crimson);
    }
  </style>
</head>
